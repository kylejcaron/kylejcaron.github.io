    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

<style title='marimo-custom'>/* Paper-and-ink framing for the retail returns notebook essay.
   Component rules are prefixed ttn- so marimo's own chrome is untouched. */

:root {
  --marimo-text-font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --marimo-heading-font: Georgia, "Iowan Old Style", serif;

  --ttn-canvas: #f2f0e9;
  --ttn-panel: #fffef9;
  --ttn-ink: #292d26;
  --ttn-muted: #62695d;
  --ttn-accent: #42644d;
  --ttn-amber: #956017;
  --ttn-red: #a23c3c;
  --ttn-rule: #dcded1;
  --ttn-band: #f5f5ed;
  --ttn-column: #ecefe4;
  --ttn-serif: Georgia, "Iowan Old Style", serif;
  --ttn-mono: var(--marimo-monospace-font, ui-monospace, SFMono-Regular, monospace);
}

#App {
  background: var(--ttn-canvas);
  color: var(--ttn-ink);
}

/* One continuous paper column. */
#App [data-cell-name] {
  width: 100%;
  max-width: 960px;
  margin-inline: auto;
  padding: 0 56px;
  background: var(--ttn-panel);
  border-inline: 1px solid var(--ttn-rule);
  border-radius: 0;
}

#App [data-cell-name]:has(.ttn-nav) {
  position: sticky;
  top: 0;
  z-index: 20;
  max-width: 960px;
  padding: 18px 0;
  margin-bottom: 28px;
  background: var(--ttn-canvas);
  border: 0;
  border-bottom: 1px solid var(--ttn-rule);
}

#App [data-cell-name]:has(.ttn-hero) {
  border-top: 1px solid var(--ttn-rule);
  padding-top: 40px;
}

#App [data-cell-name]:last-child {
  border-bottom: 1px solid var(--ttn-rule);
  padding-bottom: 48px;
}

/* Prose */

#App [data-cell-name] .markdown {
  font-size: 16.5px;
  line-height: 1.68;
  color: var(--ttn-ink);
}

#App [data-cell-name] .markdown p,
#App [data-cell-name] .markdown li {
  max-width: 72ch;
}

#App [data-cell-name] .markdown h3 {
  margin-top: 1.6em;
  font-family: var(--ttn-serif);
  font-weight: 500;
  font-size: 21px;
  letter-spacing: -0.01em;
}

#App [data-cell-name] .markdown strong {
  font-weight: 650;
}

#App [data-cell-name] .markdown a {
  color: var(--ttn-accent);
  text-underline-offset: 3px;
}

#App [data-cell-name] .markdown code {
  font-family: var(--ttn-mono);
  font-size: 0.86em;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--ttn-band);
  color: var(--ttn-ink);
}

/* Navigation */

.ttn-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  font-size: 13px;
}

.ttn-brand {
  font-family: var(--ttn-serif);
  font-size: 26px;
  letter-spacing: -0.055em;
  color: var(--ttn-ink);
  text-decoration: none;
}

.ttn-nav nav {
  display: flex;
  gap: 2px;
  min-width: 0;
  overflow-x: auto;
}

.ttn-nav nav a {
  display: block;
  padding: 8px 11px;
  color: var(--ttn-muted);
  white-space: nowrap;
  text-decoration: none;
}

.ttn-nav a:hover,
.ttn-nav a:focus-visible {
  color: var(--ttn-accent);
}

/* Hero */

.ttn-hero {
  padding: 8px 0 12px;
}

.ttn-kicker {
  margin: 0 0 14px;
  font-size: 11px;
  font-weight: 620;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ttn-accent);
}

.ttn-title {
  margin: 0;
  max-width: 22ch;
  font-family: var(--ttn-serif);
  font-size: 52px;
  font-weight: 500;
  line-height: 1.04;
  letter-spacing: -0.045em;
  color: var(--ttn-ink);
}

.ttn-dek {
  margin: 20px 0 0;
  max-width: 60ch;
  font-family: var(--ttn-serif);
  font-size: 20px;
  line-height: 1.5;
  color: var(--ttn-muted);
}

.ttn-byline {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
  margin: 22px 0 0;
  padding: 0;
  list-style: none;
  font-size: 13px;
  color: var(--ttn-muted);
}

.ttn-byline b {
  color: var(--ttn-ink);
  font-weight: 600;
}

/* Section openers */

.ttn-section {
  margin-top: 36px;
  padding-top: 34px;
  border-top: 1px solid var(--ttn-rule);
  scroll-margin-top: 96px;
}

.ttn-section-kicker {
  margin: 0 0 6px;
  font-size: 11px;
  font-weight: 620;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ttn-muted);
}

.ttn-section-title {
  margin: 0;
  font-family: var(--ttn-serif);
  font-size: 34px;
  font-weight: 500;
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--ttn-ink);
}

.ttn-section-lede {
  margin: 12px 0 0;
  max-width: 64ch;
  font-size: 16.5px;
  line-height: 1.6;
  color: var(--ttn-muted);
}

/* Summary cards */

.ttn-cards {
  display: grid;
  grid-template-columns: repeat(var(--ttn-card-count, 3), minmax(0, 1fr));
  margin: 26px 0 6px;
  padding: 20px 0 0;
  border-top: 1px solid var(--ttn-rule);
}

.ttn-card {
  min-width: 0;
  padding: 0 22px;
  border-right: 1px solid var(--ttn-rule);
}

.ttn-card:first-child {
  padding-left: 0;
}

.ttn-card:last-child {
  border-right: 0;
}

.ttn-card-label {
  margin: 0 0 4px;
  font-size: 10px;
  font-weight: 620;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ttn-muted);
}

.ttn-card-value {
  margin: 0;
  font-family: var(--ttn-serif);
  font-size: 32px;
  font-weight: 500;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--ttn-ink);
}

.ttn-card-value small {
  margin-left: 6px;
  font-size: 15px;
  color: var(--ttn-muted);
}

.ttn-card-detail {
  margin: 6px 0 0;
  font-size: 13px;
  line-height: 1.45;
  color: var(--ttn-muted);
}

.ttn-card--accent .ttn-card-value { color: var(--ttn-accent); }
.ttn-card--amber .ttn-card-value { color: var(--ttn-amber); }
.ttn-card--red .ttn-card-value { color: var(--ttn-red); }

/* Callouts */

.ttn-callout {
  margin: 22px 0;
  padding: 14px 18px 14px 20px;
  border-left: 3px solid var(--ttn-accent);
  background: var(--ttn-band);
}

.ttn-callout--warn {
  border-left-color: var(--ttn-amber);
}

.ttn-callout-label {
  margin: 0 0 4px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ttn-accent);
}

.ttn-callout--warn .ttn-callout-label {
  color: var(--ttn-amber);
}

.ttn-callout .markdown,
.ttn-callout p {
  margin: 0;
  font-size: 15.5px !important;
  line-height: 1.6 !important;
}

/* Figures */

.ttn-figure-title {
  margin: 26px 0 2px;
  font-family: var(--ttn-serif);
  font-size: 19px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ttn-ink);
}

.ttn-caption {
  margin: 6px 0 4px;
  max-width: 76ch;
  font-size: 13px;
  line-height: 1.5;
  color: var(--ttn-muted);
}

.ttn-caption b {
  color: var(--ttn-ink);
  font-weight: 600;
}

.ttn-swatch {
  display: inline-block;
  width: 18px;
  height: 3px;
  margin: 0 5px 3px 0;
  vertical-align: middle;
  border-radius: 2px;
}

/* The unit ledger */

.ttn-table-wrap {
  margin: 14px 0 6px;
  overflow-x: auto;
}

.ttn-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}

.ttn-table th,
.ttn-table td {
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--ttn-rule);
  white-space: nowrap;
}

.ttn-table thead th {
  background: var(--ttn-column);
  font-size: 11px;
  font-weight: 620;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ttn-muted);
}

.ttn-table td.ttn-mono {
  font-family: var(--ttn-mono);
  font-size: 12.5px;
  color: var(--ttn-muted);
}

.ttn-table .ttn-missing {
  color: #a9ae9f;
}

.ttn-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 620;
  letter-spacing: 0.02em;
}

.ttn-pill--received { color: var(--ttn-accent); background: #e6efe7; }
.ttn-pill--transit { color: var(--ttn-amber); background: #f4ecd7; }
.ttn-pill--eligible { color: #4c5a6b; background: #e7ebf0; }
.ttn-pill--expired { color: var(--ttn-muted); background: var(--ttn-column); }

/* Status checks */

.ttn-checks {
  margin: 16px 0 0;
  padding: 0;
  list-style: none;
}

.ttn-checks li {
  margin: 0 0 8px;
  padding-left: 12px;
  border-left: 3px solid var(--ttn-accent);
  font-size: 14px;
  color: var(--ttn-ink);
}

.ttn-checks li.ttn-check--fail {
  border-left-color: var(--ttn-red);
  color: var(--ttn-red);
}

.ttn-checks code {
  display: block;
  margin-top: 2px;
  font-family: var(--ttn-mono);
  font-size: 12px;
  color: var(--ttn-muted);
}

/* Interactive controls */

.ttn-controls {
  margin: 18px 0 6px;
  padding: 16px 18px;
  border: 1px solid var(--ttn-rule);
  background: var(--ttn-band);
}

.ttn-footer {
  margin-top: 8px;
  font-size: 13px;
  color: var(--ttn-muted);
}

@media (max-width: 760px) {
  #App [data-cell-name] {
    padding-inline: 18px;
  }

  .ttn-nav {
    display: block;
  }

  .ttn-nav nav {
    margin-top: 8px;
  }

  .ttn-title {
    font-size: 36px;
  }

  .ttn-cards {
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
  }

  .ttn-card {
    padding: 0;
    border: 0;
  }
}

hen push any\n        sales forecast through it, uncertainty and all.\n      \u003C/p\u003E\n      \u003Cul class=\"ttn-byline\"\u003E\n        \u003Cli\u003E\u003Cb\u003EKyle Caron\u003C/b\u003E\u003C/li\u003E\n        \u003Cli\u003ESeptember 2026\u003C/li\u003E\n        \u003Cli\u003EBuilt with \u003Cb\u003Ettenet\u003C/b\u003E, NumPyro \u0026amp; marimo\u003C/li\u003E\n      \u003C/ul\u003E\n    \u003C/div\u003E\n"}, "type": "data"}]}, {"code_hash": "3eccb37dc7aeba1614fde18318f43760", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "\u003Csection id=\"tldr\" class=\"ttn-section\"\u003E\u003Cp class=\"ttn-section-kicker\"\u003ETL;DR\u003C/p\u003E\u003Ch2 class=\"ttn-section-title\"\u003EReturns are a forecast of a forecast\u003C/h2\u003E\u003Cp class=\"ttn-section-lede\"\u003ENext week's warehouse receipts depend on the returns customers start this week, which depend on what sold last month and on what sells this month. Forecast each step, chain them, and push a sales forecast all the way through.\u003C/p\u003E\u003C/section\u003E"}, "type": "data"}]}, {"code_hash": "ec031c97541230ce662a05b403cbe84e", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.25rem'\u003E\u003Cp class=\"ttn-figure-title\"\u003EOne sales forecast, propagated twice\u003C/p\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0rem'\u003E\u003Cmarimo-mime-renderer data-mime='\u0026quot;application/vnd.vegalite.v6+json\u0026quot;' data-data='\u0026quot;{\u0026#92;n  \u0026#92;\u0026quot;\u0026#36;schema\u0026#92;\u0026quot;: \u0026#92;\u0026quot;https://vega.github.io/schema/vega-lite/v6.4.1.json\u0026#92;\u0026quot;,\u0026#92;n  \u0026#92;\u0026quot;config\u0026#92;\u0026quot;: {\u0026#92;n    \u0026#92;\u0026quot;autosize\u0026#92;\u0026quot;: {\ ss=\"ttn-card-label\"\u003EUnits sold, next 28 days\u003C/p\u003E\u003Cp class=\"ttn-card-value\"\u003E576\u003Csmall\u003E[537\u2013629]\u003C/small\u003E\u003C/p\u003E\u003Cp class=\"ttn-card-detail\"\u003EThe sales forecast going in. Actual: \u003Cb\u003E596\u003C/b\u003E.\u003C/p\u003E\u003C/div\u003E\u003Cdiv class=\"ttn-card ttn-card--amber\"\u003E\u003Cp class=\"ttn-card-label\"\u003EReturns started\u003C/p\u003E\u003Cp class=\"ttn-card-value\"\u003E199\u003Csmall\u003E[172\u2013225]\u003C/small\u003E\u003C/p\u003E\u003Cp class=\"ttn-card-detail\"\u003EPropagated once. Actual: \u003Cb\u003E179\u003C/b\u003E.\u003C/p\u003E\u003C/div\u003E\u003Cdiv class=\"ttn-card ttn-card--accent\"\u003E\u003Cp class=\"ttn-card-label\"\u003EReturns received\u003C/p\u003E\u003Cp class=\"ttn-card-value\"\u003E155\u003Csmall\u003E[135\u2013173]\u003C/small\u003E\u003C/p\u003E\u003Cp class=\"ttn-card-detail\"\u003EPropagated twice. Actual: \u003Cb\u003E143\u003C/b\u003E.\u003C/p\u003E\u003C/div\u003E\u003Cdiv class=\"ttn-card\"\u003E\u003Cp class=\"ttn-card-label\"\u003EStill owed by past sales\u003C/p\u003E\u003Cp class=\"ttn-card-value\"\u003E103\u003C/p\u003E\u003Cp class=\"ttn-card-detail\"\u003EEventual receipts from units already sold, whenever they arrive.\u003C/p\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "04d0e7e26f5619ff84c9e415f5a6a7c0", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EReturns forecasting is an old problem with a well-worn shortcut: multiply a sales\nforecast by a return rate and shift it by a typical lag. It holds up until something\nchanges: a promo, a storm, a new policy, or simply a quarter whose recent sales haven't\nhad time to come back yet.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis post treats it as a \u003Cstrong\u003Echain of forecasts\u003C/strong\u003E instead, and lets\n\u003Ca href=\"https://github.com/kylejcaron/ttenet\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ettenet\u003C/a\u003E do the plumbing:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Eeach step (a sale, a return started, a return received) gets its own small model,\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Eone call fits\u003C/strong\u003E the whole chain,\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Eone call propagates\u003C/strong\u003E a sales forecast through it: daily receipts, open returns,\n  and returns still owed, with uncertainty carried end to end,\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003Eswapping in\u003C/strong\u003E a different sales forecast or weather is one argument, no refit,\u003C/li\u003E\n\u003Cli\u003Eand a simple baseline shows what the chain buys you.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b7ab315e59560b7244941167fd2420e6", "console": [], "id": "Kclp", "outputs": [{"data": {"text/html": "\u003Csection id=\"data\" class=\"ttn-section\"\u003E\u003Cp class=\"ttn-section-kicker\"\u003EPart 1\u003C/p\u003E\u003Ch2 class=\"ttn-section-title\"\u003ELooking at the data\u003C/h2\u003E\u003Cp class=\"ttn-section-lede\"\u003EA retailer sells two products and offers a 90-day return window. The only thing the business actually records is a ledger: one row per unit sold, with the dates things happened to it.\u003C/p\u003E\u003C/section\u003E"}, "type": "data"}]}, {"code_hash": "e512e01e6a67081a44a7f972ed945212", "console": [], "id": "emfo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3c677c539ccf46addf9bf95b260a84a9", "console": [], "id": "Hstk", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='Hstk-0' random-id='22ba4644-55e2-7bba-72d8-4f189705cd90'\u003E\u003Cmarimo-code-editor data-initial-value='\u0026quot;# The ledger of units becomes the model\u0026#x27;s input.\u0026#92;ndata = RetailData.from_units(\u0026#92;n    ledger,\u0026#9 ' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-hidden-columns='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "b8e7f378a7cbd47d0e47dcaaef652f5b", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/html": "\u003Cdiv class=\"ttn-cards\" style=\"--ttn-card-count:4\"\u003E\u003Cdiv class=\"ttn-card ttn-card--accent\"\u003E\u003Cp class=\"ttn-card-label\"\u003EReceived\u003C/p\u003E\u003Cp class=\"ttn-card-value\"\u003E901\u003C/p\u003E\u003Cp class=\"ttn-card-detail\"\u003EBack on the shelf. The only fully observed outcome.\u003C/p\u003E\u003C/div\u003E\u003Cdiv class=\"ttn-card ttn-card--amber\"\u003E\u003Cp class=\"ttn-card-label\"\u003EReturn in transit\u003C/p\u003E\u003Cp class=\"ttn-card-value\"\u003E278\u003C/p\u003E\u003Cp class=\"ttn-card-detail\"\u003EInitiated, not received. Secretly, \u003Cb\u003E92%\u003C/b\u003E of these are abandoned; the ledger can't say which.\u003C/p\u003E\u003C/div\u003E\u003Cdiv class=\"ttn-card\"\u003E\u003Cp class=\"ttn-card-label\"\u003ECould still return\u003C/p\u003E\u003Cp class=\"ttn-card-value\"\u003E1,304\u003C/p\u003E\u003Cp class=\"ttn-card-detail\"\u003ENo return yet, still inside the 90-day window.\u003C/p\u003E\u003C/div\u003E\u003Cdiv class=\"ttn-card\"\u003E\u003Cp class=\"ttn-card-label\"\u003EWindow closed\u003C/p\u003E\u003Cp class=\"ttn-card-value\"\u003E1,190\u003C/p\u003E\u003Cp class=\"ttn-card-detail\"\u003EKept for good: past the deadline with no return.\u003C/p\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "3fb133e0f9822284f53076b0b22b7d6f", "console": [], "id": "ROlb", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EOnly the first and last cards are settled. Everything in the middle is \u003Cstrong\u003Ecensored\u003C/strong\u003E:\nwe know the clock is still running, not where it will stop. The in-transit pile is the\nsneakiest: in this world about one in five initiated returns is never shipped back (the\ncustomer keeps the prepaid label in a drawer). Those never leave \"in transit\", so after\nsix months they are nearly all of it. The ledger records no \"abandoned\" event; the model\nhas to learn it from how long open returns stay open.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EHere are the same events as daily time series.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6c36df0707daab91d9e24e48a31b6547", "console": [], "id": "qnkX", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "4bd692b2aaf30aee1be967c66146d542", "console": [], "id": "TqIu", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.25rem'\u003E\u003Cp class=\"ttn-figure-title\"\u003ESix months of the ledger, as daily counts\u003C/p\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0rem'\u003E\u003Cmarimo-mime-renderer data-mime='\u0026quot;application/vnd.vegalite.v6+json\u0026quot;' data-data='\u0026quot;{\u0026#92;n  \u0026#92;\u0026quot;\u0026#36;schema\u0026#92;\u0026quot;: \u0026#92;\u0026quot;https://vega.github.io/schema/vega-lite/v6.4.1.json\u0026#92;\u0026quot;,\u0026#92;n  \u0026#92;\u0026quot;config\u0026#92;\u0026quot;: {\u0026#92;n    \u0026#92;\u0026quot;autosize\u0026#92;\u0026quot;: {\u0026#92;n      \u0026#92;\u0026quot;contains\u0026#92;\u0026quot;: \u0026#92;\u0026quot;padding\u0026#92;\u0026quot;,\u0026#92;n      \u0026#92;\u0026quot;type\u0026#92;\u0026quot;: \u0026#92;\u0026quot;fit-x\u0026#92;\u0026quot;\u0026#92;n    },\u0026#92;n    \u0026#92;\u0026quot;axis\u0 t.\u003C/p\u003E\u003C/section\u003E"}, "type": "data"}]}, {"code_hash": "af553305885516ef969bcd2145fb6283", "console": [], "id": "ecfG", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFor each unit, four things happen (or don't):\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003ESales.\u003C/strong\u003E Product \u003Cmarimo-tex class=\"arithmatex\"\u003E||(p||)\u003C/marimo-tex\u003E sells \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{sales}_{t,p} \\sim \\text{Poisson}\\big(\\exp(\\alpha_p + \\gamma_p \\sin(2\\pi\\,\\text{weekday}_t / 7))\\big)||)\u003C/marimo-tex\u003E units on day \u003Cmarimo-tex class=\"arithmatex\"\u003E||(t||)\u003C/marimo-tex\u003E.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EIs this unit susceptible?\u003C/strong\u003E A sale is \u003Cem\u003Esusceptible\u003C/em\u003E with probability \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\pi^{\\text{init}}_p = \\sigma(a + b\\,x_p)||)\u003C/marimo-tex\u003E. The rest are \u003Cstrong\u003Ecured\u003C/strong\u003E: they never start a return, however long you wait. Susceptible units still only return if their clock rings before the deadline.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EWhen is the return initiated?\u003C/strong\u003E A susceptible unit of age \u003Cmarimo-tex class=\"arithmatex\"\u003E||(a||)\u003C/marimo-tex\u003E starts a return on day \u003Cmarimo-tex class=\"arithmatex\"\u003E||(t||)\u003C/marimo-tex\u003E with discrete hazard \u003Cmarimo-tex class=\"arithmatex\"\u003E||(h(a, t) = \\sigma\\big(\\ell_{\\min(a,\\,15)} + \\beta^\\top x_t\\big)||)\u003C/marimo-tex\u003E, but only through day 90 of the policy.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EDoes it arrive, and when?\u003C/strong\u003E An initiated return arrives at all with probability \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\pi^{\\text{rec}}||)\u003C/marimo-tex\u003E, on a second clock whose hazard drops during storms and is \u003Cem\u003Eexactly zero\u003C/em\u003E on weekends.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003EThe \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\ell||)\u003C/marimo-tex\u003E's are a flexible, regularized random-walk baseline over age, so nothing forces\na lognormal or Weibull shape on the delay. The whole thing is a small directed graph:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9f147381d989efadef123711dc7ca379", "console": [], "id": "Pvdt", "outputs": [{"data": {"text/html": "\u003Cmarimo-mermaid data-diagram='\u0026quot;\u0026#92;nflowchart LR\u0026#92;n    W([weekday]) --\u0026#92;u003e S\u0026#92;n    S((Sales)) -- \u0026#92;\u0026quot;each unit starts a clock\u0026#92;\u0026quot; --\u0026#92;u003e I((Return\u0026#92;u003cbr/\u0026#92;u003einitiated))\u0026#92;n    S -. \u0026#92;\u0026quot;cured: never starts a return\u0026#92;\u0026quot; .-\u0026#92;u003e K[kept]\u0026#92;n    P([product]) --\u0026#92;u003e I\u0026#92;n    D([90-day policy]) -. deadline .-\u0026#92;u003e I\u0026#92;n    I -- \u0026#92;\u0026quot;second clock\u0026#92;\u0026quot; --\u0026#92;u003e R((Return\u0026#92;u003cbr/\u0026#92;u003ereceived))\u0026#92;n    I -. \u0026#92;\u0026quot;cured: abandoned\u0026#92;\u0026quot; .-\u0026#92;u003e A[never arrives]\u0026#92;n    T([storms]) --\u0026#92;u003e R\u0026#92;n    C([weekends closed]) -. hard zero .-\u0026#92;u003e R\u0026#92;n    classDef stage fill:#fffef9,stroke:#42644d,stroke-width:2px,color:#292d26;\u0026#92;n    classDef cov fill:#f5f5ed,stroke:#dcded1,color:#62695d;\u0026#92;n    classDef sink fill:#f2f0e9,stroke:#dcded1,color:#62695d,stroke-dasharray:4 3;\u0026#92;n    class S,I,R stage;\u0026#92;n    class W,P,D,T,C cov;\u0026#92;n    class K,A sink;\u0026#92;n\u0026quot;' data-theme='\u0026quot;base\u0026quot;' data-theme_variables='{\u0026quot;fontFamily\u0026quot;:\u0026quot;system-ui, -apple-system, \u0026#x27;Segoe UI\u0026#x27;, sans-serif\u0026quot;,\u0026quot;fontSize\u0026quot;:\u0026quot;13px\u0026quot;,\u0026quot;lineColor\u0026quot;:\u0026quot;#62695d\u0026quot;,\u0026quot;edgeLabelBackground\u0026quot;:\u0026quot;#fffef9\u0026quot;,\u0026quot;primaryTextColor\u0026quot;:\u0026quot;#292d26\u0026quot;}'\u003E\u003C/marimo-mermaid\u003E"}, "type": "data"}]}, {"code_hash": "2e0338dac43ae473a4686e257ef5b2ec", "console": [], "id": "ZBYS", "outputs": [{"data": {"text/html": "\u003Caside class=\"ttn-callout\"\u003E\u003Cp class=\"ttn-callout-label\"\u003EKey point\u003C/p\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EPropagation happens per draw. A sale simulated for Jul 3 in posterior draw 17\nstarts its own return clock in draw 17, with draw 17's parameters, and so on down\nthe chain. That is why any sales forecast can be swapped in and pushed through with\nits uncertainty intact, and why every stage's counts add up exactly.\u003C/span\u003E\u003C/span\u003E\u003C/aside\u003E"}, "type": "data"}]}, {"code_hash": "9df3e08d2639d8b019bc190af25deb58", "console": [], "id": "aLJB", "outputs": [{"data": {"text/html": "\u003Caside class=\"ttn-callout\"\u003E\u003Cp class=\"ttn-callout-label\"\u003EHow censoring is handled\u003C/p\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EA unit that has been quiet for \u003Cmarimo-tex class=\"arithmatex\"\u003E||(a||)\u003C/marimo-tex\u003E days is not evidence against a return. Its\nlikelihood contribution is \u003Cmarimo-tex class=\"arithmatex\"\u003E||((1-\\pi) + \\pi\\,S(a)||)\u003C/marimo-tex\u003E: either it belongs to the cured\nfraction, or it is susceptible and hasn't returned yet. Given that silence, the chance it\nis still susceptible is \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\pi S(a) / \\big((1-\\pi) + \\pi S(a)\\big)||)\u003C/marimo-tex\u003E, which shrinks the\nlonger it stays quiet. That is what fixes the collapsing line in Part 1.\u003C/span\u003E\u003C/span\u003E\u003C/aside\u003E"}, "type": "data"}]}, {"code_hash": "9b259514592245ca9c2d01e4d2b3a648", "console": [], "id": "nHfw", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"writing-it-down\"\u003EWriting it down\u003C/h3\u003E\n\u003Cspan class=\"paragraph\"\u003EThe sales process is an ordinary NumPyro model following the\n\u003Ca href=\"https://github.com/juanitorduz/numpyro_forecast\" rel=\"noopener noreferrer\" target=\"_blank\"\u003E\u003Ccode\u003Enumpyro_forecast\u003C/code\u003E\u003C/a\u003E protocol: it\nreceives covariates with time on axis \u003Ccode\u003E-2\u003C/code\u003E, and \u003Ccode\u003Epredict\u003C/code\u003E handles the observed prefix\nversus the future suffix.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "1c2508d474a23c6339c145e9921b88c1", "console": [], "id": "xXTn", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003Esales_model\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Ecovariates\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Edata\u003C/span\u003E\u003Cspan class=\"o\"\u003E=\u003C/span\u003E\u003Cspan class=\"kc\"\u003ENone\u003C/span\u003E\u003Cspan class=\"p\"\u003E):\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Eh\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003EHorizon\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Efrom_data\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Ecovariates\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Edata\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Elog_rate\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Enumpyro\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Esample\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"s2\"\u003E\"log_rate\"\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Edist\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003ENormal\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E0.6\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eexpand\u003C/span\u003E\u003Cspan class=\"p\"\u003E([\u003C/span\u003E\u003Cspan class=\"mi\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E])\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eto_event\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E))\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Eweekday_effect\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Enumpyro\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Esample\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\n        \u003Cspan class=\"s2\"\u003E\"weekday_effect\"\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Edist\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003ENormal\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E0.4\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eexpand\u003C/span\u003E\u003Cspan class=\"p\"\u003E([\u003C/span\u003E\u003Cspan class=\"mi\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E])\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eto_event\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Eeta\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Elog_rate\u003C/span\u003E \u003Cspan class=\"o\"\u003E+\u003C/span\u003E \u003Cspan class=\"n\"\u003Ecovariates\u003C/span\u003E \u003Cspan class=\"o\"\u003E*\u003C/span\u003E \u003Cspan class=\"n\"\u003Eweekday_effect\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Epredict\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Eh\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"k\"\u003Elambda\u003C/span\u003E \u003Cspan class=\"n\"\u003Evalue\u003C/span\u003E\u003Cspan class=\"p\"\u003E:\u003C/span\u003E \u003Cspan class=\"n\"\u003Edist\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003EPoisson\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Ejnp\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eexp\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Evalue\u003C/span\u003E\u003Cspan class=\"p\"\u003E)),\u003C/span\u003E \u003Cspan class=\"n\"\u003Eeta\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"k\"\u003Edef\u003C/span\u003E\u003Cspan class=\"w\"\u003E \u003C/span\u003E\u003Cspan class=\"nf\"\u003Einitiation_covariates\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Eframe\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"n\"\u003Ecalendar\u003C/span\u003E\u003Cspan class=\"p\"\u003E):\u003C/span\u003E\n\u003Cspan class=\"w\"\u003E    \u003C/span\u003E\u003Cspan class=\"sd\"\u003E\"\"\"Product attributes and calendar features with fixed meanings across windows.\"\"\"\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Eproduct\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Eframe\u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"s2\"\u003E\"product\"\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eto_numpy\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"nb\"\u003Efloat\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Eweekday\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Epd\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003EDatetimeIndex\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Ecalendar\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Edayofweek\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eto_numpy\u003C/span\u003E\u003Cspan class=\"p\"\u003E()\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Efeatures\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Enp\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eempty\u003C/span\u003E\u003Cspan class=\"p\"\u003E((\u003C/span\u003E\u003Cspan class=\"nb\"\u003Elen\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Eframe\u003C/span\u003E\u003Cspan class=\"p\"\u003E),\u003C/span\u003E \u003Cspan class=\"nb\"\u003Elen\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"n\"\u003Ecalendar\u003C/span\u003E\u003Cspan class=\"p\"\u003E),\u003C/span\u003E \u003Cspan class=\"mi\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E))\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Efeatures\u003C/span\u003E\u003Cspan class=\"p\"\u003E[:,\u003C/span\u003E \u003Cspan class=\"p\"\u003E:,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Eproduct\u003C/span\u003E\u003Cspan class=\"p\"\u003E[:,\u003C/span\u003E \u003Cspan class=\"kc\"\u003ENone\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E\n    \u003Cspan class=\"n\"\u003Efeatures\u003C/span\u003E\u003Cspan class=\"p\"\u003E[:,\u003C/span\u003E \u003Cspan class=\"p\"\u003E:,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Enp\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Esin\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E2\u003C/span\u003E \u003Cspan class=\"o\"\u003E*\u003C/span\u003E \u003Cspan class=\"n\"\u003Enp\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Epi\u003C/span\u00 ope=\"col\" id=\"Daily-MAE\"\u003EDaily MAE\u003C/th\u003E\n  \u003Cth class=\"gt_col_heading gt_columns_bottom_border gt_center\" rowspan=\"1\" colspan=\"1\" style=\"color: #292d26;font-size: 16px;text-align: center;font-weight: bold; background-color: #ecefe4;\" scope=\"col\" id=\"Daily-CRPS\"\u003EDaily CRPS\u003C/th\u003E\n  \u003Cth class=\"gt_col_heading gt_columns_bottom_border gt_center\" rowspan=\"1\" colspan=\"1\" style=\"color: #292d26;font-size: 16px;text-align: center;font-weight: bold; background-color: #ecefe4;\" scope=\"col\" id=\"MAE,-storm-fortnight\"\u003EMAE, storm fortnight\u003C/th\u003E\n  \u003Cth class=\"gt_col_heading gt_columns_bottom_border gt_center\" rowspan=\"1\" colspan=\"1\" style=\"color: #292d26;font-size: 16px;text-align: center;font-weight: bold; background-color: #ecefe4;\" scope=\"col\" id=\"28-day-total-error\"\u003E28-day total error\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody class=\"gt_table_body\"\u003E\n  \u003Ctr\u003E\n    \u003Ctd style=\"background-color: #F5F5ED;\" class=\"gt_row gt_center\"\u003E\u003Cb\u003EWeekday average (last 8 weeks)\u003C/b\u003E\u003C/td\u003E\n    \u003Ctd style=\"background-color: #F5F5ED;\" class=\"gt_row gt_center\"\u003E\u003Cspan style=\"font-size:14px;font-weight:600\"\u003E1.98\u003C/span\u003E\u003C/td\u003E\n    \u003Ctd style=\"background-color: #F5F5ED;\" class=\"gt_row gt_center\"\u003E\u003Cspan style=\"font-size:14px;font-weight:600\"\u003E1.98\u003C/span\u003E\u003C/td\u003E\n    \u003Ctd style=\"background-color: #F5F5ED;\" class=\"gt_row gt_center\"\u003E\u003Cspan style=\"font-size:14px;font-weight:600\"\u003E3.54\u003C/span\u003E\u003C/td\u003E\n    \u003Ctd style=\"background-color: #F5F5ED;\" class=\"gt_row gt_center\"\u003E\u003Cspan style=\"font-size:14px;font-weight:600\"\u003E+12\u003C/span\u003E\u003C/td\u003E\n  \u003C/tr\u003E\n  \u003Ctr\u003E\n    \u003Ctd style=\"border-top: 1px solid #dcded1;\" class=\"gt_row gt_center\"\u003E\u003Cb\u003Ettenet\u003C/b\u003E\u003C/td\u003E\n    \u003Ctd style=\"border-top: 1px solid #dcded1;\" class=\"gt_row gt_center\"\u003E\u003Cspan style=\"font-size:14px;font-weight:600\"\u003E1.39\u003C/span\u003E\u003C/td\u003E\n    \u003Ctd style=\"border-top: 1px solid #dcded1;\" class=\"gt_row gt_center\"\u003E\u003Cspan style=\"font-size:14px;font-weight:600\"\u003E1.05\u003C/span\u003E\u003C/td\u003E\n    \u003Ctd style=\"border-top: 1px solid #dcded1;\" class=\"gt_row gt_center\"\u003E\u003Cspan style=\"font-size:14px;font-weight:600\"\u003E1.70\u003C/span\u003E\u003C/td\u003E\n    \u003Ctd style=\"border-top: 1px solid #dcded1;\" class=\"gt_row gt_center\"\u003E\u003Cspan style=\"font-size:14px;font-weight:600\"\u003E+12\u003C/span\u003E\u003C/td\u003E\n  \u003C/tr\u003E\n\u003C/tbody\u003E\n\n\u003C/table\u003E\n\n\u003C/div\u003E\n"}, "type": "data"}]}, {"code_hash": "abdf3767166071b2e09f7457fce96637", "console": [], "id": "vEBW", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EFor a point forecast, CRPS reduces to absolute error, so the baseline's two columns\nmatch. The baseline also has no answer at all for \u003Cem\u003Ereturns still owed\u003C/em\u003E, and no way to\ntake in a sales forecast or a weather scenario: it can only repeat the recent past.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "a3c24738fbbd8f87bbfeb1b56b9d402a", "console": [], "id": "kLmu", "outputs": [{"data": {"text/html": "\u003Csection id=\"wrap-up\" class=\"ttn-section\"\u003E\u003Cp class=\"ttn-section-kicker\"\u003EConclusion\u003C/p\u003E\u003Ch2 class=\"ttn-section-title\"\u003EChain the forecasts\u003C/h2\u003E\u003C/section\u003E"}, "type": "data"}]}, {"code_hash": "31d0bd7630dce2748da200bc56d2986e", "console": [], "id": "IpqN", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EReturns forecasting is an old problem. Splitting it into a chain of small forecasts is\nwhat makes it convenient:\u003C/span\u003E\n\u003Col\u003E\n\u003Cli\u003Ea sales forecast, \u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\text{sales}_{t,p} \\sim \\text{Poisson}(\\lambda_{t,p})||)\u003C/marimo-tex\u003E,\u003C/li\u003E\n\u003Cli\u003Ea return-initiation forecast for every sold unit, bounded by the 90-day policy,\u003C/li\u003E\n\u003Cli\u003Ea receipt forecast for every started return, respecting storms and a closed\n   warehouse.\u003C/li\u003E\n\u003C/ol\u003E\n\u003Cspan class=\"paragraph\"\u003Ettenet fits the chain in one call and propagates through it in another. Because each\nstage consumes the previous stage's forecast draw by draw, the same machinery answers\ndaily receipts, returns still owed, \"what if we sell more?\", and \"what if the storm\nlingers?\" without new models or refits, and with uncertainty carried end to end.\u003C/span\u003E\n\u003Ch3 id=\"where-this-is-honest-about-its-limits\"\u003EWhere this is honest about its limits\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003EFinite follow-up can't fully separate \"never\" from \"very late\"; the cure fraction\n  leans on mature cohorts and the priors. Check calibration on held-out periods.\u003C/li\u003E\n\u003Cli\u003EAges beyond the learned baseline reuse the last bin: flexible, not assumption-free.\u003C/li\u003E\n\u003Cli\u003EOne event of each type per unit, daily resolution, no repeated return attempts, and\n  no inventory feedback. Weather is an input you supply, never forecast.\u003C/li\u003E\n\u003Cli\u003EThe default posterior is a variational (AutoNormal) approximation. For\n  publication-grade intervals, hand \u003Ccode\u003Enetwork.numpyro_model(...)\u003C/code\u003E to NUTS.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Ch3 id=\"run-it-yourself\"\u003ERun it yourself\u003C/h3\u003E\n\u003Cdiv class=\"language-bash codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003Euv\u003Cspan class=\"w\"\u003E \u003C/span\u003Esync\u003Cspan class=\"w\"\u003E \u003C/span\u003E--all-extras\nuv\u003Cspan class=\"w\"\u003E \u003C/span\u003Erun\u003Cspan class=\"w\"\u003E \u003C/span\u003Emarimo\u003Cspan class=\"w\"\u003E \u003C/span\u003Eedit\u003Cspan class=\"w\"\u003E \u003C/span\u003Eexamples/retail_returns_blog.py\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003EThe command-line version of the same example, with the same simulator, lives in\n\u003Ccode\u003Eexamples/retail_returns.py\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c29d3186609e479a883b46b3669c29ae", "console": [], "id": "dxZZ", "outputs": [{"data": {"text/html": "\u003Cp class=\"ttn-footer\"\u003ESimulated data throughout: every \"truth\" in this post is the simulator's, and none of it reaches the estimator.\u003C/p\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.25.0", "script_metadata_hash": null}, "version": "1"},
